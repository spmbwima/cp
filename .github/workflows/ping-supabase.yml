name: Ping Supabase

on:
  schedule:
    - cron: '0 0 * * *'   # setiap hari, 00:00 UTC (07.00 WIB)
  workflow_dispatch:       # bisa dijalankan manual dari tab Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query tabel pv_catatan
        run: |
          curl -sS --fail-with-body --retry 3 --retry-delay 10 \
            "https://nrwexyezcbmsokelgkmp.supabase.co/rest/v1/pv_catatan?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
